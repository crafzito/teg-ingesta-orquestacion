services:
  postgres:
    image: postgres:16-alpine
    container_name: teg_postgres
    environment:
      POSTGRES_DB: teg_etl
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
